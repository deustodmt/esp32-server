services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MOSQUITTO_EXTERNAL_PORT:?Set MOSQUITTO_EXTERNAL_PORT in .env}:${MOSQUITTO_INTERNAL_PORT:?Set MOSQUITTO_INTERNAL_PORT in .env}"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "${MOSQUITTO_INTERNAL_PORT}", "-t", "healthcheck", "-m", "ping", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  esp32-server:
    build: ./server
    environment:
      - INFLUXDB_ORG=${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      - INFLUXDB_URL=${INFLUXDB_URL:?Set INFLUXDB_URL in .env}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-test_topic}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-}
    depends_on:
      mosquitto:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: influxdb:2.7
    ports:
      - "${INFLUXDB_EXTERNAL_PORT:?Set INFLUXDB_EXTERNAL_PORT in .env}:${INFLUXDB_INTERNAL_PORT:?Set INFLUXDB_INTERNAL_PORT in .env}"
    volumes:
      - ./db/data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
